name: Build Tilt
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/set-publish.js
      - run: npm install
      - name: Build and publish a release (when you push a v tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only (when you press Run workflow)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tilt-Windows
          path: dist/*.exe
